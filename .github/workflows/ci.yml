name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  validate:
    name: Validate registry and skills
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate registry and skills
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\installer\install.ps1 validate

  test:
    name: Run test suite
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tests\run-tests.ps1

  lint:
    name: Lint PowerShell and markdown
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Non-interactive module install: set PSGallery trusted and never
          # prompt. -Confirm:$false and -Force avoid the NuGet provider prompt.
          $ProgressPreference = 'SilentlyContinue'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber -Confirm:$false
          Import-Module PSScriptAnalyzer

          # Invoke-ScriptAnalyzer's -Path binds a single path per call.
          $issues = @()
          foreach ($dir in @('src', 'installer', 'tests')) {
            $issues += Invoke-ScriptAnalyzer -Path $dir -Severity Error
          }
          if ($issues.Count -gt 0) {
            $issues | Format-Table RuleName, ScriptName, Line, Message -AutoSize
            throw "PSScriptAnalyzer found $($issues.Count) error-level issue(s)."
          }
          Write-Host "PSScriptAnalyzer: no error-level issues."

      - name: Lint markdown
        shell: bash
        run: |
          npx --yes markdownlint-cli@0.42.0 "**/*.md" --config .markdownlint.json --ignore node_modules

  node:
    name: Build and test the Node TUI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build (TypeScript)
        run: npm run build

      - name: Test (Node)
        run: node --test --test-reporter=spec --test-timeout=120000 test/

      - name: Verify the CLI launches (non-TTY path)
        run: node bin/agentskillsmd.js validate

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
