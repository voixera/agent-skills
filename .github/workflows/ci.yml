name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  node:
    name: Build and test the TUI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts

      - name: Build (TypeScript)
        shell: bash
        run: npm run build

      - name: Test (Node)
        shell: bash
        run: |
          set +e
          node --version
          echo "--- test files ---"
          ls -la test/
          echo "--- run ---"
          npm test > test-output.txt 2>&1
          code=$?
          echo "----- test output -----"
          cat test-output.txt
          echo "----- end test output (exit $code) -----"
          exit $code

      - name: Validate registry
        shell: bash
        run: npm run validate

      - name: Verify the CLI runs in a non-TTY environment
        shell: bash
        run: node bin/agentskillsmd.js

  lint:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint markdown
        shell: bash
        run: |
          npx --yes markdownlint-cli@0.42.0 "**/*.md" --config .markdownlint.json --ignore node_modules

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
